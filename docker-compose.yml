services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TVOID_MEDIA_ROOT: /app/media
      TVOID_DATA_DIR: /app/data
    volumes:
      - ./media:/app/media
      - ./data:/app/data
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
