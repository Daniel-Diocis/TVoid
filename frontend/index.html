<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TVoid</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/api.js" defer></script>
    <script src="/js/ui.js" defer></script>
    <script src="/js/library.js" defer></script>
    <script src="/js/home.js" defer></script>
  </head>
  <body>
    <header class="topbar"></header>

    <main class="page">
      <section class="hero" id="featured-hero">
        <div class="hero-copy-block">
          <p class="eyebrow">Libreria locale</p>
          <h1>TVoid</h1>
          <p class="hero-copy">Le tue serie in streaming dal filesystem, con ripresa automatica della visione.</p>
        </div>
      </section>

      <div class="library-update">
        <button class="button secondary" id="refresh-library" type="button" disabled>Aggiorna libreria</button>
        <span id="library-status" role="status"></span>
      </div>

      <section class="content-section" id="continue-section">
        <div class="section-heading">
          <h2>Continua a guardare</h2>
        </div>
        <div class="row-scroll" id="continue-row" aria-live="polite" aria-atomic="false"></div>
      </section>

      <section class="content-section">
        <div class="section-heading">
          <h2>Serie TV</h2>
          <a class="text-link" href="/catalog.html?category=series">Vedi tutte</a>
        </div>
        <div class="row-scroll" id="series-row" aria-live="polite" aria-atomic="false"></div>
      </section>

      <section class="content-section" id="movies">
        <div class="section-heading">
          <h2>Film</h2>
          <a class="text-link" href="/catalog.html?category=movies">Vedi tutti</a>
        </div>
        <div class="row-scroll" id="movies-row" aria-live="polite" aria-atomic="false"></div>
      </section>

      <section class="content-section">
        <div class="section-heading">
          <h2>Aggiunte di recente</h2>
        </div>
        <div class="row-scroll" id="recent-row" aria-live="polite" aria-atomic="false"></div>
      </section>
    </main>
  </body>
</html>
